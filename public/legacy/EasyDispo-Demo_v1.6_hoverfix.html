          return (
            <div style={{ fontSize: 13, color: C.text }}>
              <Notification kind="info" title="Versions-Verlauf">

              <div style={{ marginTop: 12, maxHeight: 380, overflowY: "auto" }}>

                    <div key={idx} style={{
                      padding: 10, marginBottom: 6,

                      <button
                        onClick={() => restoreLineFromHistory(activeLine.id, idx)}

            <tbody>

              <tr><td style={{ padding: 8 }}>ORS HGV</td><td>✓ Maße</td><td>—</td><td>2.000/Tag</td></tr>

            Google Maps Tiles direkt zu nutzen ist in den AGB verboten — es geht nur über die offizielle JavaScript-API,
            und auch dort darf der Traffic-Layer nur in einem Google-Maps-Container laufen, nicht als beliebiger Layer
            in Leaflet. Außerdem hat Google kein dezidiertes Bus/Truck-Routing mit Maßen — `BUS` ist dort der ÖPNV-Modus
            mit Fahrplan, nicht "ein Bus, der durch den Verkehr fährt". TomTom liefert genau das, was wir brauchen.
          </p>

            <li><strong>"Auf der Linie"</strong>: Vorfall muss innerhalb 250 m vom Streckenverlauf liegen → kaum Fehlalarme.</li>
            <li><strong>"Im Linien-Bereich"</strong>: BBox + 500 m → robuster, aber auch Fehlalarme von Parallelstraßen.</li>
            <li>OS-Benachrichtigungen funktionieren nur über <code>http(s)://</code> oder <code>localhost</code>, nicht bei <code>file://</code>. Sound + In-Tab-Banner gehen immer.</li>

            detourEnd={getActiveDetourEndpoint(activeLine.activeDetour, "end")}
            routeInfo={activeLine.activeDetour?.routeInfo}
            stops={activeLine.stops}
            blockedStopIds={new Set(activeLine.activeDetour?.blockedStopIds || [])}
            useORS={settings.provider === "ors" || settings.provider === "tomtom"}
            busProfile={settings.busProfile}
            viaPoints={activeLine.activeDetour?.viaPoints || []}
          />
        </div>
      )}

    </div>
  );
}

// Fehlergrenze: verhindert, dass ein einzelner Render-Fehler die ganze Seite blank macht.
class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, fontFamily: FONT, background: C.bg, minHeight: "100vh", color: C.text }}>
          <div style={{ maxWidth: 720, margin: "40px auto", background: C.white, border: `2px solid ${C.route}`, borderRadius: 14, padding: 24, boxShadow: "0 10px 30px rgba(0,0,0,0.12)" }}>
            <h2 style={{ color: C.route, marginBottom: 10 }}>Die Oberfläche wurde gestoppt</h2>
            <p style={{ lineHeight: 1.5, marginBottom: 12 }}>
              Ein Bedienfehler oder ein unerwarteter Datenzustand hat einen internen Fehler ausgelöst. Deine gespeicherten Linien bleiben im Browser-Speicher erhalten.
            </p>
            <pre style={{ whiteSpace: "pre-wrap", background: C.creamLight, padding: 12, borderRadius: 8, fontSize: 12, overflow: "auto" }}>
              {String(this.state.error?.message || this.state.error)}
            </pre>
            <button style={{ ...btnPrimary, marginTop: 16 }} onClick={() => window.location.reload()}>
              Seite neu laden
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

  return { App, AppErrorBoundary };
})(React, ReactDOM, React.useState, React.useEffect, React.useRef, React.useCallback, React.useMemo);

function getRouteFromHash() {
  const h = (window.location.hash || "").replace(/^#\/?/, "").trim();
  if (h === "viewer" || h === "planner" || h === "editor") return h;
  return "home";
}

function MainApp() {
  const [route, setRoute] = useState(() => getRouteFromHash());
  useEffect(() => {
    const handler = () => {
      setRoute(getRouteFromHash());
      window.scrollTo(0, 0);
    };
    window.addEventListener("hashchange", handler);
    return () => window.removeEventListener("hashchange", handler);
  }, []);
  const navigate = (target) => {
    if (target === "home") window.location.hash = "";
    else window.location.hash = "#" + target;
  };
  const goHome = () => navigate("home");

  if (route === "viewer") {
    return (

        </div>
        <div className="ed-tool-content">
          <ViewerApp />
        </div>
      </div>
    );
  }

  if (route === "planner") {
    return (
      <div className="ed-tool-page">
        <div className="ed-tool-header planner-tone">
          <div className="ed-tool-header-left">
            <button onClick={goHome} className="ed-logo-mark" style={{
              border: "none", fontSize: 16, fontWeight: 800, color: "white",
              cursor: "pointer", width: 36, height: 36, fontFamily: "inherit",
