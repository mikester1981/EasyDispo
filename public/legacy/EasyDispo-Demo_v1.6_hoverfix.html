  //   2. Naechster GTFS-Halt im 50m-Radius (Lat/Lon-Match)
  // Gibt Array von Linien-Labels zurueck.
  const findGtfsRoutesForStop = useCallback(async (stop) => {
    const bundles = await loadGtfsBundlesIntoCache();
    if (!bundles || bundles.length === 0) return [];

    const labels = new Set();
    for (const bundle of bundles) {
      if (!bundle?.routesByStop || !bundle?.stops) continue;

      // 1. Direct-Match via gtfsStopId
      let matchedStopId = null;
      if (stop.gtfsStopId && bundle.routesByStop[stop.gtfsStopId]) {
        matchedStopId = stop.gtfsStopId;
      }

      // 2. Lat/Lon-Match im 50m-Radius (nur wenn kein direct match)
      if (!matchedStopId && stop.lat != null && stop.lon != null) {
        const RADIUS = 50; // Meter
        let bestId = null;
        let bestDist = Infinity;
        for (const sId in bundle.stops) {
          const gs = bundle.stops[sId];
          const d = haversineDistance(stop.lat, stop.lon, gs.lat, gs.lon);
          if (d < RADIUS && d < bestDist) {
            bestDist = d;
            bestId = sId;
          }
        }
        matchedStopId = bestId;
      }

      if (matchedStopId && bundle.routesByStop[matchedStopId]) {
        for (const rid of bundle.routesByStop[matchedStopId]) {
          const route = bundle.routes[rid];
          if (route) labels.add(gtfsRouteLabel(route));
        }
      }
    }

    return Array.from(labels).sort((a, b) => a.localeCompare(b, "de"));
  }, [loadGtfsBundlesIntoCache]);

  // Pop-up oeffnen mit Linien-Lookup
  const openStopRoutesPopup = useCallback(async (stop, anchorXY) => {
    setStopRoutesPopup({ stop, routes: null, anchorXY, loading: true });
    const routes = await findGtfsRoutesForStop(stop);
    setStopRoutesPopup({ stop, routes, anchorXY, loading: false });
  }, [findGtfsRoutesForStop]);

  // "Zur Linie springen" — Karte zoomt so, dass die ganze Linie sichtbar ist
  // Funktioniert fuer KML- und GTFS-Linien gleich (originalLine ist dasselbe Format)
  // Wenn keine originalLine vorhanden, fallback auf Halte. Wenn auch keine Halte, Hinweis.
  const jumpToLine = useCallback((line) => {
    if (!line) return;
    const points = [];
    if (line.originalLine && line.originalLine.length > 0) {
      points.push(...line.originalLine);
    }
    if (line.stops && line.stops.length > 0) {
      for (const s of line.stops) {
        if (s.lat != null && s.lon != null) points.push([s.lat, s.lon]);
      }
    }
    if (points.length === 0) {
      alert("Diese Linie hat keine Streckenpunkte und keine Halte — kann nicht angezeigt werden.");
      return;
    }
    setFlyToTarget({ bounds: points, ts: Date.now() });
  }, []);

  const deleteLine = (id) => {
    const line = lines.find((l) => l.id === id);
    if (!line) return;
    setLineDeleteRequest({ id, step: 1 });
    setLineDeleteText("");
  };

  const cancelLineDelete = () => {
    setLineDeleteRequest(null);
    setLineDeleteText("");
  };

  const confirmLineDelete = () => {
    if (!linePendingDeletion || !lineDeleteNameMatches) return;
    const id = linePendingDeletion.id;
    setLines((prev) => prev.filter((l) => l.id !== id));
    if (activeLineId === id) {
      setActiveLineId(null);
      setEditMode("view");
    }
    cancelLineDelete();
  };

  const updateLine = (id, updater) => {
    setLines((prev) => prev.map((l) => l.id === id
      ? { ...updater(l), updatedAt: Date.now() }
      : l));
  };

  const exportAllLines = () => {
    const blob = new Blob([JSON.stringify({ version: 1, exportedAt: Date.now(), lines, settings: { busProfile: settings.busProfile } }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `sev-linien-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importLines = async (file) => {
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.lines || !Array.isArray(data.lines)) throw new Error("Format unbekannt");
      const importedCount = data.lines.length;
      if (lines.length > 0) {
        if (!confirm(`${importedCount} Linien importieren? Bestehende ${lines.length} Linien werden ersetzt.`)) return;
      }
      setLines(data.lines);
      setActiveLineId(null);
      setEditMode("view");
      alert(`${importedCount} Linien importiert.`);
    } catch (e) {
      alert("Import fehlgeschlagen: " + e.message);
    }
  };

  // -------------------- Linien-Bearbeitung --------------------
  const updateStopName = (lineId, stopId, newName) => {
    updateLine(lineId, (l) => ({
      ...l,
      stops: l.stops.map((s) => s.id === stopId ? { ...s, name: newName } : s),
    }));
  };

  const cleanupDetourAfterStopDelete = (detour, removedIds) => {
    if (!detour) return null;
    // Wenn Start oder Ende geloescht werden, ist die gespeicherte Umleitung fachlich nicht mehr gueltig.
    if (removedIds.has(detour.startStopId) || removedIds.has(detour.endStopId)) return null;
    return {
      ...detour,
      blockedStopIds: (detour.blockedStopIds || []).filter((id) => !removedIds.has(id)),
      updatedAt: Date.now(),
    };
  };

  const removeStopsByIds = (lineId, stopIds, { confirmDelete = true } = {}) => {
    const removedIds = new Set(stopIds);
    if (removedIds.size === 0) return;

    const targetLine = lines.find((l) => l.id === lineId);
    const invalidatesDetour = targetLine?.activeDetour &&
      (removedIds.has(targetLine.activeDetour.startStopId) || removedIds.has(targetLine.activeDetour.endStopId));

    if (confirmDelete) {
      const extra = invalidatesDetour
        ? "\n\nAchtung: Start- oder Endhalt der aktiven Umleitung ist betroffen. Die gespeicherte Umleitung wird entfernt."
        : "";
      if (!confirm(`${removedIds.size} Halte wirklich loeschen?${extra}`)) return;
    }

    updateLine(lineId, (l) => ({
      ...l,
      stops: l.stops.filter((s) => !removedIds.has(s.id)),
      activeDetour: cleanupDetourAfterStopDelete(l.activeDetour, removedIds),
    }));

    if (lineId === activeLineId) {
      setSelectedStopIds((prev) => {
        const next = new Set(prev);
        removedIds.forEach((id) => next.delete(id));
        return next;
      });
      setDraftDetour((prev) => {
        if (!prev) return prev;
        const nextBlocked = new Set(prev.blockedIds);
        removedIds.forEach((id) => nextBlocked.delete(id));
        return {
          ...prev,
          startId: removedIds.has(prev.startId) ? null : prev.startId,
          endId: removedIds.has(prev.endId) ? null : prev.endId,
          blockedIds: nextBlocked,
        };
      });
    }
  };

  const deleteStop = (lineId, stopId) => {
    removeStopsByIds(lineId, [stopId], { confirmDelete: false });
  };

  const toggleStopSelection = (stopId) => {
    setSelectedStopIds((prev) => {
      const next = new Set(prev);
      if (next.has(stopId)) next.delete(stopId); else next.add(stopId);
      return next;
    });
  };

  const selectFilteredStops = () => {
    setSelectedStopIds((prev) => {
      const next = new Set(prev);
      filteredStops.forEach((s) => next.add(s.id));
      return next;
    });
  };

  const clearStopSelection = () => setSelectedStopIds(new Set());

  const deleteSelectedStops = () => {
    if (!activeLine) return;
    removeStopsByIds(activeLine.id, Array.from(selectedStopIds));
  };

  const selectStopRangeByNumber = () => {
    if (!activeLine) return;
    const fromRaw = prompt("Erste laufende Nummer aus der Halte-Liste:");
    if (fromRaw === null) return;
    const toRaw = prompt("Letzte laufende Nummer aus der Halte-Liste:");
    if (toRaw === null) return;
    const from = Math.max(1, parseInt(fromRaw, 10));
    const to = Math.min(activeLine.stops.length, parseInt(toRaw, 10));
    if (!Number.isFinite(from) || !Number.isFinite(to) || from > to) {
      alert("Ungueltiger Bereich.");
      return;
    }
    const ids = activeLine.stops.slice(from - 1, to).map((s) => s.id);
    setSelectedStopIds((prev) => {
      const next = new Set(prev);
      ids.forEach((id) => next.add(id));
      return next;
    });
  };

  const keepOnlyStopRangeByNumber = () => {
    if (!activeLine) return;
    const fromRaw = prompt("Erste laufende Nummer, die behalten werden soll:");
    if (fromRaw === null) return;
    const toRaw = prompt("Letzte laufende Nummer, die behalten werden soll:");
    if (toRaw === null) return;
    const from = Math.max(1, parseInt(fromRaw, 10));
    const to = Math.min(activeLine.stops.length, parseInt(toRaw, 10));
    if (!Number.isFinite(from) || !Number.isFinite(to) || from > to) {
      alert("Ungueltiger Bereich.");
      return;
    }
    const keepIds = new Set(activeLine.stops.slice(from - 1, to).map((s) => s.id));
    const removeIds = activeLine.stops.filter((s) => !keepIds.has(s.id)).map((s) => s.id);
    removeStopsByIds(activeLine.id, removeIds);
  };

  const renameLine = (id, newName) => {
    updateLine(id, (l) => ({ ...l, name: newName }));
  };

  // -------------------- Umleitung erstellen / bearbeiten --------------------
  const startNewDetour = () => {
    setClickMode(null);
    setRouteError("");
    setDraftDetour({
      startId: null,
      endId: null,
      startPoint: null,
      endPoint: null,
      blockedIds: new Set(),
      viaPoints: [],
      manualMode: false,
      manualSnap: true,
      manualSnapProvider: "auto",
      line: [],
      info: null,
      note: "",
    });
    setEditMode("detour");
  };

  const editExistingDetour = () => {
    if (!activeLine?.activeDetour) return;
    const d = activeLine.activeDetour;
    setClickMode(null);
    setRouteError("");
    setDraftDetour({
      startId: d.startStopId || null,
      endId: d.endStopId || null,
      startPoint: d.startPoint || null,
      endPoint: d.endPoint || null,
      blockedIds: new Set(d.blockedStopIds || []),
      viaPoints: d.viaPoints || [],
      manualMode: !!d.manualMode,
      manualSnap: d.manualSnap !== false,
      manualSnapProvider: d.manualSnapProvider || "auto",
      line: d.detourLine || [],
      info: d.routeInfo || null,
      note: d.note || "",
    });
    setEditMode("detour");
  };

  const cancelDetour = () => {
    setDraftDetour(null);
    setClickMode(null);
    setRouteError("");
    setSuggestions([]);
    setHoveredSuggestion(null);
    setEditMode("line");
  };

  const saveDetour = () => {
    if (!draftDetour || !activeLine) return;
    if (!draftDetour.line || draftDetour.line.length < 2) {
      alert("Bitte zuerst die Umleitung berechnen lassen.");
      return;
    }
    updateLine(activeLine.id, (l) => ({
      ...l,
      activeDetour: {
        startStopId: draftDetour.startId || null,
        endStopId: draftDetour.endId || null,
        startPoint: draftDetour.startPoint || null,
        endPoint: draftDetour.endPoint || null,
        blockedStopIds: Array.from(draftDetour.blockedIds),
        viaPoints: draftDetour.viaPoints,
        manualMode: !!draftDetour.manualMode,
        manualSnap: draftDetour.manualSnap !== false,
        manualSnapProvider: draftDetour.manualSnapProvider || "auto",
        detourLine: draftDetour.line,
        routeInfo: draftDetour.info,
        note: draftDetour.note,
        createdAt: l.activeDetour?.createdAt || Date.now(),
        updatedAt: Date.now(),
      },
    }));
    setDraftDetour(null);
    setClickMode(null);
    setSuggestions([]);
    setHoveredSuggestion(null);
    setEditMode("line");
  };

  const removeActiveDetour = () => {
    if (!activeLine) return;
    if (!confirm(`Aktive Umleitung von "${activeLine.name}" beenden?`)) return;
    updateLine(activeLine.id, (l) => ({ ...l, activeDetour: null }));
  };

  const getDraftEndpoint = useCallback((which, draft = draftDetour) => {
    if (!draft || !activeLine) return null;
    const id = which === "start" ? draft.startId : draft.endId;
    const freePoint = which === "start" ? draft.startPoint : draft.endPoint;
    if (freePoint && typeof freePoint.lat === "number" && typeof freePoint.lon === "number") {
      return { lat: freePoint.lat, lon: freePoint.lon, name: freePoint.name || (which === "start" ? "Freier Startpunkt" : "Freier Endpunkt"), kind: "free" };
    }
    const stop = activeLine.stops.find((s) => s.id === id);
    return stop ? { ...stop, kind: "stop" } : null;
  }, [draftDetour, activeLine]);

  const getActiveDetourEndpoint = useCallback((detour, which) => {
    if (!detour || !activeLine) return null;
    const id = which === "start" ? detour.startStopId : detour.endStopId;
    const freePoint = which === "start" ? detour.startPoint : detour.endPoint;
    if (freePoint && typeof freePoint.lat === "number" && typeof freePoint.lon === "number") {
      return { lat: freePoint.lat, lon: freePoint.lon, name: freePoint.name || (which === "start" ? "Freier Startpunkt" : "Freier Endpunkt"), kind: "free" };
    }
    const stop = activeLine.stops.find((s) => s.id === id);
    return stop ? { ...stop, kind: "stop" } : null;
  }, [activeLine]);

  const resetDraftRoute = (patch) => ({
    ...patch,
    line: [],
    info: null,
  });

  // Wegpunkt an Klick-Position auf der Linie einfuegen.
  // Insertion-Index: zwischen den zwei Anker-Punkten (Start, Wp0, Wp1, ..., Ende),
  // an deren Verbindungs-Segment der Klick am naechsten liegt.
  const insertViaPointAt = useCallback((lat, lon) => {
    setDraftDetour((p) => {
      if (!p) return p;
      const startPt = getDraftEndpoint("start", p);
      const endPt = getDraftEndpoint("end", p);
      if (!startPt || !endPt) return p;
      // Anker: Start + Wegpunkte + Ende, jeweils als [lat, lon]
      const anchors = [
        [startPt.lat, startPt.lon],
        ...p.viaPoints,
        [endPt.lat, endPt.lon],
      ];
      // Punkt-zu-Segment-Distanz (in Grad-Quadrat, reicht zum Vergleichen)
      const pointToSegSq = (px, py, ax, ay, bx, by) => {
        const dx = bx - ax, dy = by - ay;
        const len2 = dx * dx + dy * dy;
        let t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));
        const cx = ax + t * dx, cy = ay + t * dy;
        return (px - cx) ** 2 + (py - cy) ** 2;
      };
      let bestSegIdx = 0;
      let bestDistSq = Infinity;
      for (let i = 0; i < anchors.length - 1; i++) {
        const [ax, ay] = anchors[i];
        const [bx, by] = anchors[i + 1];
        const d = pointToSegSq(lat, lon, ax, ay, bx, by);
        if (d < bestDistSq) {
          bestDistSq = d;
          bestSegIdx = i;
        }
      }
      // Einfuegen vor Anchor (bestSegIdx + 1) — also als neuer Wegpunkt
      // mit Listen-Index = bestSegIdx (weil viaPoints-Index 0 = nach Start)
      const next = p.viaPoints.slice();
      next.splice(bestSegIdx, 0, [lat, lon]);
      return resetDraftRoute({ ...p, viaPoints: next });
    });
  }, [getDraftEndpoint]);

  // -------------------- Routing --------------------
  const calcRoute = useCallback(async () => {
    if (!draftDetour || !activeLine) return;
    const startPoint = getDraftEndpoint("start", draftDetour);
    const endPoint = getDraftEndpoint("end", draftDetour);
    if (!startPoint || !endPoint) return;

    setRouting(true);
    setRouteError("");
    setSuggestions([]);
    try {
      const start = [startPoint.lat, startPoint.lon];
      const end = [endPoint.lat, endPoint.lon];

      // Manueller Modus: Tool-eigenes Routing OHNE TomTom.
      // Geradlinig oder via OSRM/Valhalla-Snapping (kostenlos, ohne Key).
      // Hier laufen NIE Alternativen oder TomTom-Anfragen.
      if (draftDetour.manualMode) {
        const mode = draftDetour.manualSnap !== false ? "snapped" : "straight";
        const result = await routeManual(start, end, draftDetour.viaPoints || [], mode, draftDetour.manualSnapProvider || "auto");
        setDraftDetour((prev) => prev ? {
          ...prev,
          line: result.coords,
          info: { distance: result.distance, duration: result.duration, provider: result.provider },
        } : prev);
        if (result.snapFailed) {
          setRouteError(`${result.provider || "Routing-Dienst nicht erreichbar"} — Strecke wurde geradlinig verbunden.`);
        }
        return;
      }

      // Alternativrouten nur ohne Wegpunkte und nur bei TomTom anfragen.
      // Mit Wegpunkten waeren die Vorschlaege ja eingeschraenkt — dann macht
      // nur eine Route Sinn.
      const wantSuggestions = settings.provider === "tomtom"
        && (!draftDetour.viaPoints || draftDetour.viaPoints.length === 0);

      if (wantSuggestions) {
        if (!settings.tomtomKey.trim()) throw new Error("TomTom-Key fehlt — in Einstellungen eintragen.");
        const routes = await routeTomTom(start, end, settings.tomtomKey.trim(), [], settings.busProfile, 2);
        // routes ist ein Array von Route-Objekten
        if (!routes || routes.length === 0) throw new Error("Keine Routen gefunden.");

        const profile = BUS_PROFILES[settings.busProfile] || BUS_PROFILES.artic;
        const provider = `TomTom Truck mit Live-Traffic (${profile.label})`;
        setSuggestions(routes);
        // Erste Route als Default uebernehmen
        setDraftDetour((prev) => prev ? {
          ...prev,
          line: routes[0].coords,
          info: { distance: routes[0].distance, duration: routes[0].duration, provider },
        } : prev);
        return;
      }

      // Standard-Routing (ein Ergebnis)
      let result;
      if (settings.provider === "tomtom") {
        if (!settings.tomtomKey.trim()) throw new Error("TomTom-Key fehlt — in Einstellungen eintragen.");
        result = await routeTomTom(start, end, settings.tomtomKey.trim(), draftDetour.viaPoints, settings.busProfile);
      } else if (settings.provider === "ors") {
        if (!settings.orsKey.trim()) throw new Error("ORS-Key fehlt — in Einstellungen eintragen.");
        result = await routeORS(start, end, settings.orsKey.trim(), draftDetour.viaPoints, settings.busProfile);
      } else {
        result = await routeOSRM(start, end, draftDetour.viaPoints);
      }

      setDraftDetour((prev) => prev ? {
        ...prev,
        line: result.coords,
        info: { distance: result.distance, duration: result.duration, provider: result.provider },
      } : prev);
    } catch (e) {
      setRouteError(e.message);
      setDraftDetour((prev) => prev ? { ...prev, line: [], info: null } : prev);
    } finally {
      setRouting(false);
    }
  }, [draftDetour?.startId, draftDetour?.endId, draftDetour?.startPoint, draftDetour?.endPoint, draftDetour?.viaPoints, settings.provider, settings.tomtomKey, settings.orsKey, settings.busProfile, activeLine, getDraftEndpoint]);

  // Auswahl eines Vorschlags uebernehmen
  const selectSuggestion = (idx) => {
    const s = suggestions.find((x) => x.idx === idx);
    if (!s) return;
    const profile = BUS_PROFILES[settings.busProfile] || BUS_PROFILES.artic;
    const provider = `TomTom Truck mit Live-Traffic (${profile.label})`;
    setDraftDetour((prev) => prev ? {
      ...prev,
      line: s.coords,
      info: { distance: s.distance, duration: s.duration, provider },
    } : prev);
  };

  // Auto-Routing bei Änderungen
  // Im manuellen Modus mit Debouncing (300ms), damit Drag-Operationen
  // nicht jeden Frame eine OSRM-Anfrage absetzen.
  useEffect(() => {
    const hasStart = !!(draftDetour?.startId || draftDetour?.startPoint);
    const hasEnd = !!(draftDetour?.endId || draftDetour?.endPoint);
    if (editMode !== "detour" || !hasStart || !hasEnd) return;
    if (draftDetour?.manualMode) {
      // Debouncing: 300ms warten, dann rechnen
      const t = setTimeout(() => { calcRoute(); }, 300);
      return () => clearTimeout(t);
    }
    // Standard-Modus: sofort
    calcRoute();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [draftDetour?.startId, draftDetour?.endId, draftDetour?.startPoint, draftDetour?.endPoint, draftDetour?.viaPoints, draftDetour?.manualMode, draftDetour?.manualSnap, settings.provider, settings.busProfile]);

  // -------------------- Karten-Click --------------------
  const handleMapClick = useCallback(({ lat, lon }) => {
    if ((clickMode === "selectStart" || clickMode === "selectEnd") && draftDetour && activeLine) {
      const isStart = clickMode === "selectStart";
      const free = makeFreeEndpoint(lat, lon, activeLine.originalLine, isStart ? "Start" : "Ende");
      setDraftDetour((prev) => prev ? resetDraftRoute({
        ...prev,
        ...(isStart
          ? { startId: null, startPoint: free }
          : { endId: null, endPoint: free }),
      }) : prev);
      setSuggestions([]);
      // Modus bleibt aktiv: so kann man den Punkt sofort neu setzen, ohne den Prozess abzubrechen.
    } else if (clickMode === "addVia" && draftDetour) {
      setDraftDetour((prev) => prev ? resetDraftRoute({ ...prev, viaPoints: [...prev.viaPoints, [lat, lon]] }) : prev);
      setSuggestions([]);  // Vorschlaege passen nicht mehr, sobald Wegpunkte gesetzt sind
    } else if (clickMode === "addStop" && activeLine) {
      const name = prompt("Name des neuen Halts:", `Halt ${activeLine.stops.length + 1}`);
      if (name === null) return;
      updateLine(activeLine.id, (l) => ({
        ...l,
        stops: [...l.stops, { id: newId("s"), name: name || `Halt ${l.stops.length + 1}`, lat, lon }],
      }));
    }
  }, [clickMode, draftDetour, activeLine]);

  const handleStopClick = useCallback((s) => {
    if (clickMode === "selectStart") {
      setDraftDetour((prev) => prev ? resetDraftRoute({ ...prev, startId: s.id, startPoint: null }) : prev);
      setSuggestions([]);
      // Auswahlmodus bleibt an, damit man Start/Ende ohne Abbruch direkt korrigieren kann.
    } else if (clickMode === "selectEnd") {
      setDraftDetour((prev) => prev ? resetDraftRoute({ ...prev, endId: s.id, endPoint: null }) : prev);
      setSuggestions([]);
      // Auswahlmodus bleibt an, damit man Start/Ende ohne Abbruch direkt korrigieren kann.
    } else if (clickMode === "block") {
      setDraftDetour((prev) => {
        if (!prev) return prev;
        const next = new Set(prev.blockedIds);
        if (next.has(s.id)) next.delete(s.id); else next.add(s.id);
        return { ...prev, blockedIds: next };
      });
    } else if (editMode === "line") {
      toggleStopSelection(s.id);
    }
  }, [clickMode, editMode]);

  // -------------------- Export --------------------
  const downloadKML = () => {
    if (!activeLine) return;
    const detour = activeLine.activeDetour;
    const blockedSet = new Set(detour?.blockedStopIds || []);
    const blockedStops = activeLine.stops.filter((s) => blockedSet.has(s.id));
    const kml = buildKML({
      originalLine: activeLine.originalLine,
      detourLine: detour?.detourLine || [],
      stops: activeLine.stops,
      blockedStops,
      name: activeLine.name,
    });
    const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${activeLine.name.replace(/[^a-z0-9_-]/gi, "_")}.kml`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // -------------------- Print-Preview --------------------
  // Schnappt einen Snapshot der LIVE-KARTE (mapWrapperRef). Vorteil: was der
  // User auf dem Bildschirm sieht, ist genau das, was im PDF landet — er kann
  // vorher zoomen/pannen, um den gewuenschten Ausschnitt zu waehlen.
  // Floating-Elemente (Traffic-Toggle, Alert-Panel) werden waehrend des
  // Snapshots versteckt.
  const openPrintPreview = async () => {
    if (!mapWrapperRef.current) {
      alert("Karte ist nicht bereit. Einen Moment warten und erneut klicken.");
      return;
    }
    setPrintState("preparing");
    setMapImage(null);

    // Floating-Elemente verstecken

    // Kurz warten, damit DOM aktualisiert ist (und Tiles sicher geladen sind)
    await new Promise((r) => setTimeout(r, 300));

    try {
      const canvas = await html2canvas(mapWrapperRef.current, {
        useCORS: true,
        backgroundColor: "#FFFFFF",
        scale: 2,
        logging: false,
      });
      setMapImage(canvas.toDataURL("image/png"));
      setPrintState("ready");
    } catch (e) {
      alert("Snapshot fehlgeschlagen: " + e.message);
      setMapImage(null);
      setPrintState("ready");
    } finally {
      // Floating-Elemente wieder einblenden
      floats.forEach((el) => { el.style.visibility = ""; });
    }
  };

  // Legacy ref (wird nicht mehr genutzt, aber andernfalls referenzieren noch
  // andere Code-Stellen darauf)
  const printMapRef = useRef(null);
  const handlePrintMapReady = useCallback(() => {}, []);

  // -------------------- Render --------------------

  // Daten fuer Karte zusammenstellen
  const mapStops = (editMode === "detour" && draftDetour) ? activeLine?.stops || []
                 : (editMode === "line" || editMode === "view") ? activeLine?.stops || []
                 : [];
  const mapBlocked = (editMode === "detour" && draftDetour) ? draftDetour.blockedIds
                  : (activeLine?.activeDetour) ? new Set(activeLine.activeDetour.blockedStopIds || [])
                  : new Set();
  const mapDetourLine = (editMode === "detour" && draftDetour) ? draftDetour.line
                      : (activeLine?.activeDetour) ? activeLine.activeDetour.detourLine
                      : [];
  const mapDetourEndpoints = (editMode === "detour" && draftDetour)
    ? { start: getDraftEndpoint("start"), end: getDraftEndpoint("end") }
    : (activeLine?.activeDetour)
      ? { start: getActiveDetourEndpoint(activeLine.activeDetour, "start"), end: getActiveDetourEndpoint(activeLine.activeDetour, "end") }
      : null;
  const backgroundLines = activeLine
    ? otherLines.map((l) => ({ id: l.id, name: l.name, line: l.originalLine }))
    : lines.map((l) => ({ id: l.id, name: l.name, line: l.originalLine }));

  return (
    <div className="app-root" style={{ height: "100vh", minHeight: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>

      <div className="no-print">
        <AppHeader toolTitle="Linien & Umleitungen" />

        <div className="app-statusbar" style={{
          background: C.creamLight,
          padding: "10px 32px",
          borderBottom: `1px solid ${C.border}`,
          display: "flex",
          alignItems: "center",
          gap: 12,
          fontSize: 13,
        }}>
          <span style={{ color: C.textMuted, fontWeight: 600 }}>Routing:</span>
          <span style={{
            background: settings.provider === "tomtom" ? C.success : settings.provider === "ors" ? C.warn : C.borderStrong,
            color: C.white, padding: "3px 10px", borderRadius: 999, fontSize: 11, fontWeight: 700, letterSpacing: 0.5,
          }}>
            {settings.provider === "tomtom" ? "TOMTOM (Bus + Live-Traffic)" : settings.provider === "ors" ? "ORS HGV" : "OSRM PKW"}
          </span>
          {settings.provider === "tomtom" && settings.showTraffic && (
            <span style={{
              background: C.route, color: C.white, padding: "3px 10px", borderRadius: 999, fontSize: 11, fontWeight: 700, letterSpacing: 0.5,
            }}>
              LIVE-VERKEHR AKTIV
            </span>
          )}
          {monitorStatus.active && (
            <span
              onClick={() => runMonitoringCheck(true)}
              title={monitoringRunning
                ? "Verkehrsmeldungen werden geladen …"
                : "Klick: Verkehrsmeldungen jetzt manuell prüfen — auch zuvor geschlossene Pop-ups erscheinen wieder"}
              style={{
                background: C.success, color: C.white, padding: "3px 10px", borderRadius: 999,
                fontSize: 11, fontWeight: 700, letterSpacing: 0.5,
                display: "flex", alignItems: "center", gap: 6,
                cursor: monitoringRunning ? "wait" : "pointer",
                opacity: monitoringRunning ? 0.7 : 1,
                transition: "opacity 0.2s ease",
              }}>
              <span style={{
                width: 8, height: 8, borderRadius: "50%", background: C.white,
                animation: "pulse 1.5s ease-in-out infinite",
              }}></span>
              {monitoringRunning
                ? "MONITORING · prüfe …"
                : `MONITORING · alle ${monitorStatus.currentInterval} min (${monitorStatus.currentLabel}) · ↻`}
            </span>
          )}
          {alerts.length > 0 && (
            <span style={{
              background: C.warn, color: C.white, padding: "3px 10px", borderRadius: 999,
              fontSize: 11, fontWeight: 700, letterSpacing: 0.5, cursor: "pointer",
            }} onClick={() => {
              const el = document.getElementById("alerts-panel");
              if (el) el.scrollIntoView({ behavior: "smooth" });
            }}>
              ⚠ {alerts.length} {alerts.length === 1 ? "Warnung" : "Warnungen"}
            </span>
          )}
          {settings.dwd?.enabled && (
            <span style={{
              background: filteredDwdWarnings.length ? C.warn : C.success,
              color: C.white, padding: "3px 10px", borderRadius: 999,
              fontSize: 11, fontWeight: 700, letterSpacing: 0.5, cursor: "pointer",
            }} onClick={() => setShowWeatherPanel(true)} title="DWD-Wetterwarnungen öffnen">
              🌦 DWD {filteredDwdWarnings.length}/{dwdWarnings.length}
            </span>
          )}
          <div style={{ flex: 1 }}></div>
          {settings.monitoring.enabled && (
            <button
              style={{
                ...btnGhost, padding: "6px 10px", fontWeight: 600,
                color: settings.monitoring.soundEnabled ? C.navy : C.route,
              }}
              onClick={() => setSettings((s) => ({
                ...s, monitoring: { ...s.monitoring, soundEnabled: !s.monitoring.soundEnabled },
              }))}
              title={settings.monitoring.soundEnabled ? "Alarm-Sound stummschalten" : "Alarm-Sound einschalten"}
            >
              {settings.monitoring.soundEnabled ? "🔊" : "🔇"}
            </button>
          )}
          <button
            style={{ ...btnGhost, padding: "6px 12px", color: C.navy, fontWeight: 600 }}
            onClick={() => setShowInfoModal(true)}
          >
            ⓘ Hilfe
          </button>
          <button
            style={{ ...btnGhost, padding: "6px 12px", color: C.navy, fontWeight: 600 }}
            onClick={() => setShowSettings(true)}
          >
            ⚙ Einstellungen
          </button>
        </div>
      </div>

      <div className="app-main-layout" style={{
        flex: 1,
        display: "grid",
        gridTemplateColumns: sidebarCollapsed ? "56px 1fr" : "400px 1fr",
        gap: 0,
      }}>

        {/* ============== SIDEBAR ============== */}
        <div className="no-print app-sidebar" style={{
          background: C.bg,
          borderRight: `1px solid ${C.border}`,
          padding: sidebarCollapsed ? 10 : 20,
          overflowY: sidebarCollapsed ? "hidden" : "auto",
          maxHeight: "calc(100vh - 130px)",

          {sidebarCollapsed ? (
            <div className="sidebar-collapsed-strip">

                className="collapse-round-btn"

                const isEmpty = (!l.originalLine || l.originalLine.length < 2)

                const statusLabel = isEmpty

                  : (monitored

                const statusTitle = isEmpty

                      ? "Monitoring ist ausgeschaltet — in den Einstellungen aktivieren"

                return (
                  <Card key={l.id} padding={14} style={{

                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span title={statusTitle} style={{
                        width: 10, height: 10, borderRadius: "50%",
                        background: dotColor,
                        flexShrink: 0,
                        boxShadow: `0 0 0 3px ${dotColor}25`,
                        cursor: "help",
                      }}></span>
                      <input
                        type="text"
                        value={l.name}
                        onChange={(e) => renameLine(l.id, e.target.value)}
                        onClick={(e) => e.stopPropagation()}
                        style={{
                          flex: 1, border: "none", background: "transparent",
                          fontSize: 15, fontWeight: 700, color: C.navy,
                          fontFamily: FONT, outline: "none", padding: "2px 4px",
                          borderBottom: `1px dashed transparent`,

                        onFocus={(e) => e.target.style.borderBottomColor = C.border}
                        onBlur={(e) => e.target.style.borderBottomColor = "transparent"}
                        title="Klick zum Umbenennen"
                      />
                      <button
                        onClick={(e) => { e.stopPropagation(); deleteLine(l.id); }}
                        style={{
                          background: "transparent", border: "none",
                          color: C.route, cursor: "pointer",
                          fontSize: 18, lineHeight: 1, padding: "2px 6px",
                          borderRadius: 4,
                        }}
                        title="Linie sicher löschen …"
                        onMouseOver={(e) => e.currentTarget.style.background = "#FEE"}
                        onMouseOut={(e) => e.currentTarget.style.background = "transparent"}
                      >×</button>
                    </div>
                    <div
                      onClick={() => {
                        // Linie nur als aktiv markieren — Karte zeigt sie automatisch,
                        // aber OHNE flyTo-Effekt. Edit-Modus bleibt "view".
                        // Erst beim "Öffnen →" wird in den Edit-Modus gewechselt
                        // und die Karte zoomt zur Linie hin.
                        setActiveLineId(l.id);
                      }}
                      style={{
                        marginLeft: 18, marginTop: 6, paddingTop: 4,
                        cursor: "pointer", fontSize: 12, color: C.textMuted,
                        display: "flex", alignItems: "center", justifyContent: "space-between",
                      }}
                      title="Klick zeigt Linie auf der Karte. Über 'Öffnen →' kommst du in den Bearbeitungs-Modus."
                    >
                      <span>
                        {l.stops.length} Halte · {statusLabel}
                        {l.lineSource && (l.lineSource === "gtfs_shape" || l.lineSource === "gtfs_stops") && (
                          <span style={{
                            marginLeft: 8, padding: "1px 6px",
                            background: C.cream, color: C.navy,
                            borderRadius: 3, fontSize: 10, fontWeight: 700,
                            letterSpacing: 0.4,
                          }}>GTFS</span>
                        )}
                      </span>
                      <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <span
                          onClick={(e) => { e.stopPropagation(); jumpToLine(l); }}
                          title="Karte zur Linie zoomen"
                          style={{
                            color: C.navy, fontSize: 14,
                            padding: "0 4px", cursor: "pointer",
                          }}
                        >📍</span>
                        <span
                          onClick={(e) => {
                            // Edit-Modus ausdruecklich nur bei diesem Klick
                            e.stopPropagation();
                            setActiveLineId(l.id);
                            setEditMode("line");
                            setClickMode(null);
                          }}
                          title="Linie zur Bearbeitung öffnen (Halte, Notizen, Umleitung erstellen)"
                          style={{
                            color: C.navy, fontWeight: 600,
                            cursor: "pointer", padding: "2px 6px",
                            borderRadius: 4,
                          }}
                          onMouseOver={(e) => e.currentTarget.style.background = C.creamLight}
                          onMouseOut={(e) => e.currentTarget.style.background = "transparent"}
                        >Öffnen →</span>
                      </span>
                    </div>
                  </Card>
                );
              })}
            </>
          )}

          {/* --- Modus: Linie geöffnet (Übersicht) --- */}
          {editMode === "line" && activeLine && (
            <>
              <button style={{ ...btnGhost, marginBottom: 12, fontSize: 13 }} onClick={() => { setActiveLineId(null); setEditMode("view"); }}>
                ← Zurück zur Liste
              </button>

              <input
                type="text"
                value={activeLine.name}
                onChange={(e) => renameLine(activeLine.id, e.target.value)}
                style={{
                  ...inputStyle, fontSize: 18, fontWeight: 700, color: C.navy,
                  padding: "10px 14px", marginBottom: 8, border: "none", background: "transparent",
                }}
              />

              {activeLine.lineSource === "stops" && (
                <Notification kind="warn" title="Linie aus Halten generiert">
                  Diese KML enthielt keine Streckengeometrie, nur Halte-Punkte.
                  Die Linie wird gestrichelt durch die Halte gezeichnet — das ist nur eine Näherung,
                  nicht der echte Streckenverlauf. Über "🛠 Linie reparieren" kannst du eine echte Bus-Route erzeugen.
                </Notification>
              )}
              {activeLine.lineSource === "gtfs_stops" && (
                <Notification kind="warn" title="GTFS ohne Streckenverlauf">
                  Dieses GTFS-Bundle enthält keine shapes.txt. Die Linie ist nur durch
                  geradlinige Verbindung der Halte angenähert — nicht der echte Straßenverlauf.
                  Über "🛠 Linie reparieren" kannst du via Routing eine bus-taugliche Linie erzeugen.
                </Notification>
              )}
              {activeLine.lineSource === "gtfs_shape" && (
                <Notification kind="success" title="GTFS mit Streckenverlauf">
                  Diese Linie wurde direkt aus den GTFS-shapes übernommen — das ist der echte Streckenverlauf.
                </Notification>
              )}
              {activeLine.lineSource === "routed" && (
                <Notification kind="success" title="Linie via Routing erstellt">
                  Diese Linie wurde aus den Halten via Routing neu aufgebaut und folgt einer Bus-tauglichen Strecke.
                </Notification>
              )}

              <button
                style={{ ...btnSecondary, width: "100%", fontSize: 13, padding: "8px 14px", marginBottom: 12 }}
                onClick={() => jumpToLine(activeLine)}
                title="Karte so zoomen, dass die ganze Linie sichtbar ist"
              >
                📍 Zur Linie springen
              </button>

              {activeLine.activeDetour ? (
                <Card padding={16} style={{ background: C.cream, border: "none", marginBottom: 16 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.warn, letterSpacing: 1, marginBottom: 6 }}>
                    ⚠ UMLEITUNG AKTIV
                  </div>
                  <div style={{ fontSize: 14, color: C.text, marginBottom: 4 }}>
                    {getActiveDetourEndpoint(activeLine.activeDetour, "start")?.name || "?"}
                    {" → "}
                    {getActiveDetourEndpoint(activeLine.activeDetour, "end")?.name || "?"}
                  </div>
                  {activeLine.activeDetour.routeInfo && (
                    <div style={{ fontSize: 13, color: C.textMuted }}>
                      {fmtKm(activeLine.activeDetour.routeInfo.distance)} · {fmtMin(activeLine.activeDetour.routeInfo.duration)}
                    </div>
                  )}
                  {/* Verlängerung gegenüber Original-Strecke */}
                  {(() => {
                    const impact = computeDetourImpact(activeLine);
                    if (!impact) return null;
                    const extraMin = Math.round(impact.extraDur / 60);
                    const extraKm = (impact.extraDist / 1000);
                    // Farbschema: grün bei Verkürzung, gelb bei kleiner Verlängerung,
                    // rot bei großer Verlängerung
                    const isShorter = extraMin < 0 && extraKm < 0;
                    const isLarge = extraMin >= 10 || extraKm >= 3;
                    const accentColor = isShorter ? C.success
                      : isLarge ? C.route
                      : C.warn;
                    const sign = (n) => n >= 0 ? "+" : "";
                    const labelDist = isShorter
                      ? `${sign(extraKm)}${extraKm.toFixed(1).replace(".", ",")} km`
                      : `+${extraKm.toFixed(1).replace(".", ",")} km`;
                    const labelMin = isShorter
                      ? `${sign(extraMin)}${extraMin} min`
                      : `+${extraMin} min`;
                    return (
                      <div style={{
                        marginTop: 8,
                        padding: "8px 10px",
                        background: C.white,
                        border: `1px solid ${accentColor}`,
                        borderLeft: `4px solid ${accentColor}`,
                        borderRadius: 6,
                      }}>
                        <div style={{
                          fontSize: 10, fontWeight: 800, letterSpacing: 1,
                          color: accentColor, marginBottom: 3,
                        }}>
                          {isShorter ? "VERKÜRZUNG" : "VERLÄNGERUNG"}
                        </div>
                        <div style={{ fontSize: 14, fontWeight: 700, color: C.navy }}>
                          {labelDist} <span style={{ color: C.textMuted, fontWeight: 500 }}>·</span> {labelMin}
                        </div>
                        <div style={{ fontSize: 10, color: C.textMuted, marginTop: 3, lineHeight: 1.3 }}>
                          gegenüber Original-Strecke
                          <span style={{ fontStyle: "italic" }}> · Zeit-Schätzung mit 30 km/h Bus-Schnitt</span>
                        </div>
                      </div>
                    );
                  })()}
                  <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                    <button style={{ ...btnPrimary, flex: 1, fontSize: 13, padding: "10px 14px" }} onClick={editExistingDetour}>

                    <button style={{ ...btnDanger, flex: 1, fontSize: 13, padding: "10px 14px" }} onClick={removeActiveDetour}>

                </button>

                </div>
              </div>

              {activeLine.activeDetour?.detourLine?.length > 1 && (
                <div style={{
                  marginBottom: 12, padding: 10,
                  background: C.creamLight, borderRadius: 8,
                  fontSize: 12,

                  <div style={{ fontWeight: 700, color: C.navy, marginBottom: 6 }}>
                    🔗 Umleitungs-Route teilen
                  </div>
                  <div style={{ marginBottom: 8 }}>
                    <a
                      href={buildGoogleMapsUrl(activeLine.activeDetour.detourLine)}
                      target="_blank"
                      rel="noopener noreferrer"
                      style={{ color: C.navy, fontWeight: 600, textDecoration: "underline" }}
                    >
                      Google Maps öffnen →
                    </a>
                  </div>
                  <button
                    style={{ ...btnSecondary, width: "100%", fontSize: 12, padding: "6px 10px" }}
                    onClick={() => setShowShareModal(true)}
                  >
                    📲 Per WhatsApp / E-Mail teilen
                  </button>
                </div>
              )}
              <div style={{ marginBottom: 16 }}>
                <button style={{ ...btnSecondary, width: "100%", fontSize: 13, padding: "10px 14px" }} onClick={downloadKML}>
                  📥 KML herunterladen
                </button>
              </div>

              <div style={{ fontSize: 13, fontWeight: 600, color: C.navy, marginBottom: 8 }}>
                Halte ({activeLine.stops.length}) · Auswahl: {selectedStopIds.size}
              </div>

              <input
                type="text"
                value={stopFilter}
                onChange={(e) => setStopFilter(e.target.value)}
                placeholder="Halte filtern, z.B. Hbf, Ersatz, 120 ..."
                style={{
                  width: "100%", marginBottom: 8, padding: "8px 10px",
                  border: `1px solid ${C.border}`, borderRadius: 8,
                  fontSize: 13, outline: "none", background: C.white, color: C.text,
                }}
              />

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 8 }}>
                <button style={{ ...btnSecondary, fontSize: 12, padding: "7px 8px" }} onClick={selectFilteredStops}>
                  Gefilterte auswählen ({filteredStops.length})
                </button>
                <button style={{ ...btnSecondary, fontSize: 12, padding: "7px 8px" }} onClick={selectStopRangeByNumber}>
                  Bereich auswählen
                </button>
                <button style={{ ...btnSecondary, fontSize: 12, padding: "7px 8px" }} onClick={clearStopSelection}>
                  Auswahl leeren
                </button>
                <button
                  style={{ ...btnDanger, fontSize: 12, padding: "7px 8px", opacity: selectedStopIds.size ? 1 : 0.45 }}

                  Auswahl löschen
                </button>
              </div>

              <button
                style={{ ...btnDanger, width: "100%", fontSize: 12, padding: "7px 8px", marginBottom: 8 }}
                onClick={keepOnlyStopRangeByNumber}

                Nur Nummernbereich behalten …
              </button>

              {hiddenFilteredStopCount > 0 && (
                <div style={{
                  fontSize: 11, color: C.textMuted, marginBottom: 6,
                  background: C.creamLight, border: `1px solid ${C.border}`,
                  borderRadius: 8, padding: "6px 8px",

                </div>

              <div style={{ maxHeight: 280, overflowY: "auto", border: `1px solid ${C.border}`, borderRadius: 8, marginBottom: 12 }}>
                {displayedStops.map((s) => {
                  const originalIndex = activeLine.stops.findIndex((x) => x.id === s.id);
                  const selected = selectedStopIds.has(s.id);
                  return (
                    <div key={s.id} style={{
                      padding: "8px 12px",
                      borderBottom: `1px solid ${C.border}`,
                      display: "flex", alignItems: "center", gap: 8,
                      background: selected ? "rgba(232,142,16,0.12)" : "transparent",
                    }}>
                      <input
                        type="checkbox"
                        checked={selected}
                        onChange={() => toggleStopSelection(s.id)}
                        title="Für Mehrfach-Löschung auswählen"
                      />
                      <span style={{
                        width: 30, flex: "0 0 30px", fontSize: 12,
                        color: C.textMuted, textAlign: "right",
                      }}>
                        {originalIndex + 1}.
                      </span>
                      <input type="text" value={s.name}
                        onChange={(e) => updateStopName(activeLine.id, s.id, e.target.value)}
                        style={{ flex: 1, border: "none", background: "transparent", fontSize: 13, fontFamily: FONT, color: C.text, outline: "none" }} />
                      <button
                        onClick={(e) => openStopRoutesPopup(s, { x: e.clientX, y: e.clientY })}
                        title="Andere Linien an diesem Halt anzeigen (aus geladenen GTFS-Datensätzen)"
                        style={{
                          background: "transparent", border: "none",
                          color: C.navy, cursor: "pointer", fontSize: 14,
                          padding: "0 4px",
                        }}
                      >🚉</button>
                      <button onClick={() => deleteStop(activeLine.id, s.id)}
                        style={{ background: "transparent", border: "none", color: C.route, cursor: "pointer", fontSize: 14 }}>×</button>
                    </div>
                  );
                })}
              </div>

              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <button style={{ ...btnSecondary, flex: 1, fontSize: 13, padding: "8px 14px" }}
                  onClick={() => setClickMode(clickMode === "addStop" ? null : "addStop")}>
                  {clickMode === "addStop" ? "✓ Klicke …" : "＋ Halt"}
                </button>
                <button
                  style={{ ...btnSecondary, flex: 1, fontSize: 13, padding: "8px 14px" }}
                  onClick={() => openGtfsStopPicker((stop) => {
                    // GTFS-Halt als regulären Halt zur aktiven Linie hinzufuegen
                    if (!activeLine) return;
                    const newStop = {
                      id: newId("s"),
                      name: stop.name,
                      lat: stop.lat,
                      lon: stop.lon,
                      gtfsStopId: stop.gtfsStopId,
                    };
                    updateLine(activeLine.id, (l) => ({
                      ...l,
                      stops: [...l.stops, newStop],
                      updatedAt: Date.now(),
                    }));
                  })}
                  title="Halt aus geladenem GTFS-Datensatz auswählen (z.B. Hbf-Position einer S-Bahn)"
                >
                  🚉 GTFS
                </button>
              </div>

              <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                <button style={{ ...btnSecondary, flex: 1, fontSize: 13, padding: "8px 14px" }}
                  onClick={() => setShowRepairModal(true)}>
                  🛠 Reparieren
                </button>
                <button style={{ ...btnSecondary, flex: 1, fontSize: 13, padding: "8px 14px" }}
                  onClick={() => setShowHistoryModal(true)}
                  title="Vorherige Versionen dieser Linie ansehen und wiederherstellen">
                  ⟲ Verlauf
                </button>
              </div>

              {/* v5.0: Plausibilitäts-Check
                  Aktiv sobald eine Umleitung gespeichert ist. Zeigt OK/Hinweis/
                  Kritisch-Befunde an, damit der Disponent vor dem Rausgeben
                  der Meldung typische Fehler abfängt. */}
              {(() => {
                const checks = checkLinePlausibility(activeLine);
                const hasBad = checks.some((c) => c.level === "bad");
                const hasMid = checks.some((c) => c.level === "mid");
                const headerColor = hasBad ? C.route : (hasMid ? C.warn : C.success);
                const statusLabel = hasBad ? "Kritisch — bitte prüfen"
                  : (hasMid ? "Hinweise vorhanden"
                  : "Alle Prüfungen bestanden");
                return (
                  <Card padding={14} style={{
                    marginBottom: 12,
                    border: `2px solid ${headerColor}`,
                  }}>
                    <div style={{
                      display: "flex", alignItems: "center", gap: 8,
                      marginBottom: 10,
                    }}>
                      <span style={{
                        width: 8, height: 8, borderRadius: "50%",
                        background: headerColor, flexShrink: 0,
                      }}></span>
                      <strong style={{ color: C.navy, fontSize: 13 }}>
                        Plausibilitäts-Prüfung
                      </strong>
                      <span style={{
                        marginLeft: "auto", fontSize: 11,
                        color: headerColor, fontWeight: 700,
                      }}>{statusLabel}</span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {checks.map((c, i) => (
                        <div key={i} style={{
                          fontSize: 12, color: C.text, lineHeight: 1.4,
                          padding: "4px 0",
                        }}>
                          <span className={
                            c.level === "ok" ? "sev-check-badge sev-check-ok"
                            : c.level === "bad" ? "sev-check-badge sev-check-bad"
                            : "sev-check-badge sev-check-mid"
                          }>
                            {c.level === "ok" ? "OK" : c.level === "bad" ? "KRITISCH" : "PRÜFEN"}
                          </span>
                          {c.text}
                        </div>
                      ))}
                    </div>
                  </Card>
                );
              })()}

              <LineNotesEditor
                notes={activeLine.notes}
                onChange={(newNotes) => updateLine(activeLine.id, (l) => ({ ...l, notes: newNotes }))}
              />

              <button style={{ ...btnDanger, width: "100%", fontSize: 13, padding: "8px 14px" }}
                onClick={() => deleteLine(activeLine.id)}>
                Linie löschen …
              </button>
            </>
          )}

          {/* --- Modus: Umleitung bearbeiten --- */}
          {editMode === "detour" && activeLine && draftDetour && (
            <>
              <button style={{ ...btnGhost, marginBottom: 12, fontSize: 13 }} onClick={cancelDetour}>
                ← Abbrechen
              </button>

              <h2 style={{ color: C.navy, fontSize: 18, marginBottom: 4 }}>Umleitung</h2>
              <div style={{ fontSize: 13, color: C.textMuted, marginBottom: 16 }}>{activeLine.name}</div>

              <div style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.navy, marginBottom: 4 }}>Start</div>
                <button style={{ ...btnSecondary, width: "100%", textAlign: "left", fontSize: 13, padding: "10px 14px" }}
                  onClick={() => setClickMode(clickMode === "selectStart" ? null : "selectStart")}>
                  {(() => {
                    const ep = getDraftEndpoint("start");
                    if (ep) return `📍 ${ep.name}`;
                    return clickMode === "selectStart"
                      ? "→ Halt anklicken ODER Punkt auf KML-Strecke antippen"
                      : "Start wählen";
                  })()}
                </button>
              </div>

              <div style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.navy, marginBottom: 4 }}>Ende</div>
                <button style={{ ...btnSecondary, width: "100%", textAlign: "left", fontSize: 13, padding: "10px 14px" }}
                  onClick={() => setClickMode(clickMode === "selectEnd" ? null : "selectEnd")}>
                  {(() => {
                    const ep = getDraftEndpoint("end");
                    if (ep) return `📍 ${ep.name}`;
                    return clickMode === "selectEnd"
                      ? "→ Halt anklicken ODER Punkt auf KML-Strecke antippen"
                      : "Ende wählen";
                  })()}
                </button>
              </div>

              <div style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.navy, marginBottom: 4 }}>
                  Gesperrte Halte ({draftDetour.blockedIds.size})
                </div>
                <button style={{ ...btnSecondary, width: "100%", textAlign: "left", fontSize: 13, padding: "10px 14px" }}
                  onClick={() => setClickMode(clickMode === "block" ? null : "block")}>
                  {clickMode === "block" ? "→ Halte zum Sperren anklicken" : "Halte sperren / freigeben"}
                </button>
              </div>

              {/* Manuelle Strecke: Tool-eigenes Routing OHNE TomTom.
                  Fuer Faelle, wo die Stadt eine konkrete Strecke vorgibt
                  und TomTom die Route nicht so legen kann wie gewuenscht. */}
              <div style={{
                marginBottom: 12,
                padding: 10,
                background: draftDetour.manualMode ? C.creamLight : "transparent",
                border: `1px solid ${draftDetour.manualMode ? C.navy : C.border}`,
                borderRadius: 6,
              }}>
                <label style={{
                  display: "flex", alignItems: "center", gap: 8,
                  cursor: "pointer", fontSize: 13, fontWeight: 600, color: C.navy,
                }}>
                  <input
                    type="checkbox"
                    checked={!!draftDetour.manualMode}
                    onChange={(e) => setDraftDetour((p) => p ? resetDraftRoute({
                      ...p, manualMode: e.target.checked,
                    }) : p)}
                    style={{ cursor: "pointer" }}
                  />
                  Route manuell erstellen
                </label>
                {draftDetour.manualMode && (
                  <>
                    <div style={{ fontSize: 11, color: C.textMuted, marginTop: 6, marginBottom: 8, lineHeight: 1.4 }}>
                      Du klickst die Wegpunkte selbst auf der Karte. Das Tool verbindet sie entweder
                      geradlinig oder per Straßen-Snapping über OSRM/Valhalla. Ideal für Stadt-Vorgaben
                      oder freie Routen.
                    </div>
                    <label style={{
                      display: "flex", alignItems: "center", gap: 8,
                      cursor: "pointer", fontSize: 12, color: C.text, marginBottom: 4,
                    }}>
                      <input
                        type="radio"
                        name="manualSnap"
                        checked={draftDetour.manualSnap !== false}
                        onChange={() => setDraftDetour((p) => p ? resetDraftRoute({ ...p, manualSnap: true }) : p)}
                        style={{ cursor: "pointer" }}
                      />
                      <span><strong>Auf Straßen snappen</strong> — Routing-Dienst berechnet den logischen Weg</span>
                    </label>
                    {draftDetour.manualSnap !== false && (
                      <div style={{ margin: "4px 0 8px 24px" }}>
                        <select
                          value={draftDetour.manualSnapProvider || "auto"}
                          onChange={(e) => setDraftDetour((p) => p ? resetDraftRoute({
                            ...p,
                            manualSnapProvider: e.target.value,
                          }) : p)}
                          style={{
                            width: "100%",
                            padding: "8px 10px",
                            border: `1px solid ${C.border}`,
                            borderRadius: 6,
                            background: C.white,
                            color: C.text,
                            fontSize: 12,
                          }}
                        >
                          <option value="auto">Auto-Fallback: OSRM → Valhalla → Luftlinie</option>
                          <option value="osrm">Nur OSRM (schnell, kostenlos, ohne Key)</option>
                          <option value="valhalla">Nur Valhalla (OSM-basiert, ohne Key)</option>
                        </select>
                        <div style={{ fontSize: 10.5, color: C.textMuted, marginTop: 4, lineHeight: 1.35 }}>
                          Empfehlung: Auto-Fallback. Wenn OSRM ausfällt, versucht das Tool automatisch Valhalla.
                        </div>
                      </div>
                    )}
                    <label style={{
                      display: "flex", alignItems: "center", gap: 8,
                      cursor: "pointer", fontSize: 12, color: C.text,
                    }}>
                      <input
                        type="radio"
                        name="manualSnap"
                        checked={draftDetour.manualSnap === false}
                        onChange={() => setDraftDetour((p) => p ? resetDraftRoute({ ...p, manualSnap: false }) : p)}
                        style={{ cursor: "pointer" }}
                      />
                      <span><strong>Geradlinig verbinden</strong> — Luftlinie zwischen Punkten</span>
                    </label>
                  </>
                )}
              </div>

              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.navy, marginBottom: 4 }}>
                  Wegpunkte ({draftDetour.viaPoints.length})
                  {draftDetour.manualMode && (
                    <span style={{
                      marginLeft: 8, padding: "1px 6px",
                      background: C.navy, color: C.white,
                      borderRadius: 3, fontSize: 10, fontWeight: 700,
                      letterSpacing: 0.4,
                    }}>MANUELL</span>
                  )}
                </div>
                <button style={{ ...btnSecondary, width: "100%", fontSize: 13, padding: "10px 14px" }}
                  onClick={() => setClickMode(clickMode === "addVia" ? null : "addVia")}>
                  {clickMode === "addVia" ? "→ Klicke auf Karte für Wegpunkt" : "＋ Wegpunkt setzen"}
                </button>
                {draftDetour.line && draftDetour.line.length > 1 && (
                  <div style={{
                    marginTop: 6, padding: "6px 8px",
                    background: C.creamLight, borderRadius: 4,
                    fontSize: 10, color: C.textMuted, lineHeight: 1.4,
                  }}>
                    💡 Tipp: Klick auf die rote Linie fügt einen Wegpunkt direkt dort ein.
                    Wegpunkte kannst du auf der Karte ziehen — Doppelklick entfernt sie.
                  </div>
                )}
                {draftDetour.viaPoints.length > 0 && (
                  <>
                    <div style={{
                      marginTop: 8, marginBottom: 4,
                      maxHeight: 220, overflowY: "auto",
                      border: `1px solid ${C.border}`, borderRadius: 6,
                      padding: 6, background: C.creamLight,
                    }}>
                      {draftDetour.viaPoints.map((wp, idx) => (
                        <div key={idx} style={{
                          display: "flex", alignItems: "center", gap: 6,
                          padding: "4px 6px", marginBottom: 3,
                          background: C.white, borderRadius: 4,
                          fontSize: 11,
                        }}>
                          <span style={{
                            display: "inline-flex", alignItems: "center", justifyContent: "center",
                            width: 20, height: 20, borderRadius: "50%",
                            background: C.navy, color: C.white,
                            fontSize: 10, fontWeight: 700, flexShrink: 0,
                          }}>{idx + 1}</span>
                          <span style={{ flex: 1, color: C.textMuted, fontFamily: "monospace" }}>
                            {wp[0].toFixed(4)}, {wp[1].toFixed(4)}
                          </span>
                          <button
                            onClick={() => setDraftDetour((p) => {
                              if (!p || idx === 0) return p;
                              const next = p.viaPoints.slice();
                              [next[idx - 1], next[idx]] = [next[idx], next[idx - 1]];
                              return resetDraftRoute({ ...p, viaPoints: next });
                            })}
                            disabled={idx === 0}
                            title="Nach oben"
                            style={{
                              background: "transparent", border: "none",
                              color: idx === 0 ? C.borderStrong : C.navy,
                              cursor: idx === 0 ? "default" : "pointer",
                              fontSize: 12, lineHeight: 1, padding: "0 3px",
                            }}
                          >▲</button>
                          <button
                            onClick={() => setDraftDetour((p) => {
                              if (!p || idx === p.viaPoints.length - 1) return p;
                              const next = p.viaPoints.slice();
                              [next[idx], next[idx + 1]] = [next[idx + 1], next[idx]];
                              return resetDraftRoute({ ...p, viaPoints: next });
                            })}
                            disabled={idx === draftDetour.viaPoints.length - 1}
                            title="Nach unten"
                            style={{
                              background: "transparent", border: "none",
                              color: idx === draftDetour.viaPoints.length - 1 ? C.borderStrong : C.navy,
                              cursor: idx === draftDetour.viaPoints.length - 1 ? "default" : "pointer",
                              fontSize: 12, lineHeight: 1, padding: "0 3px",
                            }}
                          >▼</button>
                          <button
                            onClick={() => setDraftDetour((p) => p ? resetDraftRoute({
                              ...p,
                              viaPoints: p.viaPoints.filter((_, i) => i !== idx),
                            }) : p)}
                            title={`Wegpunkt ${idx + 1} entfernen`}
                            style={{
                              background: "transparent", border: "none",
                              color: C.route, cursor: "pointer",
                              fontSize: 14, lineHeight: 1, padding: "0 4px",
                            }}
                          >×</button>
                        </div>
                      ))}
                    </div>
                    <button style={{ ...btnGhost, width: "100%", fontSize: 12, color: C.route, marginTop: 4 }}
                      onClick={() => setDraftDetour((p) => p ? resetDraftRoute({ ...p, viaPoints: [] }) : p)}>
                      Alle Wegpunkte löschen
                    </button>
                  </>
                )}
              </div>

              {/* Im Manuell-Modus: Auto-Routing mit Debouncing.
                  Button als optionaler Trigger fuer den Fall dass der User
                  jetzt sofort rechnen will, statt 300ms zu warten. */}
              {draftDetour.manualMode && (
                <button
                  onClick={calcRoute}
                  disabled={routing
                    || !(draftDetour.startId || draftDetour.startPoint)
                    || !(draftDetour.endId || draftDetour.endPoint)}
                  style={{
                    ...btnPrimary, width: "100%", fontSize: 14, padding: "12px 14px",
                    marginBottom: 12,
                    opacity: routing
                      || !(draftDetour.startId || draftDetour.startPoint)
                      || !(draftDetour.endId || draftDetour.endPoint) ? 0.5 : 1,
                  }}
                >
                  {routing
                    ? "Berechne …"
                    : "Strecke jetzt berechnen"}
                </button>
              )}

              {routing && <Notification kind="info" title="Berechne …">Einen Moment.</Notification>}
              {routeError && <Notification kind="error" title="Routing-Fehler">{routeError}</Notification>}

              {!routing && suggestions.length > 1 && (
                <div style={{ marginTop: 12, marginBottom: 12 }}>
                  <div style={{
                    fontSize: 12, fontWeight: 700, color: C.navy,
                    letterSpacing: 0.5, marginBottom: 8, display: "flex",
                    alignItems: "center", gap: 6,
                  }}>
                    💡 {suggestions.length} Routen-Vorschläge
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {suggestions.map((s) => {
                      const isSelected = draftDetour.line === s.coords
                        || (draftDetour.info && Math.abs(draftDetour.info.distance - s.distance) < 1
                            && Math.abs(draftDetour.info.duration - s.duration) < 1);
                      const palette = ["#C8102E", "#7B5CD6", "#0A8CB8", "#D67C3C"];
                      const color = s.idx === 0 ? palette[0] : palette[s.idx % palette.length];
                      const delayMin = Math.round((s.trafficDelay || 0) / 60);
                      const isFastest = suggestions.every((o) => s.duration <= o.duration);
                      const isShortest = suggestions.every((o) => s.distance <= o.distance);
                      return (
                        <div
                          key={s.idx}
                          onClick={() => selectSuggestion(s.idx)}
                          onMouseEnter={() => setHoveredSuggestion(s.idx)}
                          onMouseLeave={() => setHoveredSuggestion(null)}
                          style={{
                            padding: 10,
                            background: isSelected ? C.creamLight : C.white,
                            border: `2px solid ${isSelected ? color : C.border}`,
                            borderRadius: 8,
                            cursor: "pointer",
                            transition: "all 0.15s",
                          }}
                        >
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                            <span style={{
                              width: 16, height: 4, background: color,
                              borderRadius: 2, flexShrink: 0,
                            }}></span>
                            <strong style={{ fontSize: 13, color: C.navy, flex: 1 }}>
                              {s.idx === 0 ? "Vorschlag 1 (Standard)" : `Alternative ${s.idx}`}
                            </strong>
                            {isSelected && (
                              <span style={{
                                fontSize: 9, fontWeight: 700, color: C.white,
                                background: color, padding: "2px 6px", borderRadius: 3, letterSpacing: 0.5,
                              }}>
                                AKTIV
                              </span>
                            )}
                          </div>
                          <div style={{ fontSize: 12, color: C.text, marginLeft: 24 }}>
                            <strong>{fmtKm(s.distance)}</strong> · <strong>{fmtMin(s.duration)}</strong>
                            {delayMin > 0 && (
                              <span style={{ color: C.warn, marginLeft: 6 }}>
                                · +{delayMin} min Stau
                              </span>
                            )}
                          </div>
                          {(isFastest || isShortest) && suggestions.length > 1 && (
                            <div style={{ display: "flex", gap: 4, marginLeft: 24, marginTop: 4 }}>
                              {isFastest && (
                                <span style={{
                                  fontSize: 9, fontWeight: 700, color: C.success,
                                  background: C.cream, padding: "1px 5px", borderRadius: 3, letterSpacing: 0.5,
                                }}>⚡ SCHNELLSTE</span>
                              )}
                              {isShortest && !isFastest && (
                                <span style={{
                                  fontSize: 9, fontWeight: 700, color: C.navy,
                                  background: C.cream, padding: "1px 5px", borderRadius: 3, letterSpacing: 0.5,
                                }}>📏 KÜRZESTE</span>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                  <div style={{ fontSize: 11, color: C.textMuted, marginTop: 8, lineHeight: 1.4 }}>
                    Tipp: Klick auf Karte oder hier wählt eine Route aus.
                    Mit Wegpunkten kannst du jederzeit improvisieren.
                  </div>
                </div>
              )}

              {draftDetour.info && !routing && suggestions.length <= 1 && (
                <Notification kind="success" title="Route berechnet">
                  {fmtKm(draftDetour.info.distance)} · {fmtMin(draftDetour.info.duration)}<br />
                  <span style={{ fontSize: 11 }}>{draftDetour.info.provider}</span>
                </Notification>
              )}

              <Field
                label="Notiz (optional)"
                value={draftDetour.note}
                onChange={(v) => setDraftDetour((p) => ({ ...p, note: v }))}
                placeholder="z.B. Stau auf B228, Sperrung Brücke X"
              />

              <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                <button style={{ ...btnGhost, flex: 1 }} onClick={cancelDetour}>Abbrechen</button>
                <button style={{ ...btnPrimary, flex: 2 }} onClick={saveDetour} disabled={!draftDetour.line || draftDetour.line.length < 2}>
                  Speichern
                </button>
              </div>
            </>
          )}

            </>
          )}
        </div>

        {/* ============== KARTE ============== */}
        <div ref={mapWrapperRef} className="app-map-panel" style={{ position: "relative" }}>
          <MapView
            originalLine={activeLine?.originalLine || []}
            lineSource={activeLine?.lineSource || "none"}
            detourLine={mapDetourLine}
            stops={mapStops}
            blockedStopIds={mapBlocked}
            selectedStopIds={editMode === "line" ? selectedStopIds : new Set()}
            backgroundLines={backgroundLines}
            suggestions={editMode === "detour" ? suggestions : []}
            hoveredSuggestion={hoveredSuggestion}
            selectMode={!!clickMode}
            onMapClick={handleMapClick}
            onStopClick={handleStopClick}
            onSuggestionClick={selectSuggestion}
            showTraffic={settings.showTraffic && settings.provider === "tomtom"}
            tomtomKey={settings.tomtomKey}
            flyToTarget={flyToTarget}
            mapStyle={settings.mapStyle || "voyager"}
            incidentMarkers={activeIncidents}
            onIncidentClick={jumpToIncidentMarker}
            showDwdWarnings={!!settings.dwd?.showLayer}
            dwdLayerKey={settings.dwd?.layerKey || "all"}
            detourEndpoints={mapDetourEndpoints}
            viaPoints={editMode === "detour" ? (draftDetour?.viaPoints || []) : []}
            onViaPointClick={(idx) => setDraftDetour((p) => p ? resetDraftRoute({
              ...p, viaPoints: p.viaPoints.filter((_, i) => i !== idx),
            }) : p)}
            onViaPointDrag={(idx, lat, lon) => setDraftDetour((p) => {
              if (!p) return p;
              const next = p.viaPoints.slice();
              if (idx < 0 || idx >= next.length) return p;
              next[idx] = [lat, lon];
              return resetDraftRoute({ ...p, viaPoints: next });
            })}
            onViaPointInsert={(lat, lon) => insertViaPointAt(lat, lon)}
            easydispoStamm={easydispoStamm}

                const length = props.length ? (props.length / 1000).toFixed(1) : null;

                const fmtTime = (ts) => {
                  if (!ts) return null;
                  const d = new Date(ts);
                  if (isNaN(d.getTime())) return null;
                  return d.toLocaleString("de-DE", {
                    day: "2-digit", month: "2-digit",

                  const b = parseInt(h.substring(4, 6), 16);
                  return `rgba(${r},${g},${b},${alpha})`;
                };

                    border: `2px solid ${boxColor}`,

                      <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 6 }}>
                        {props.from && props.to ? `${props.from} → ${props.to}` : (props.from || props.to)}

                    )}

                    {/* Zeitangaben — Gueltigkeit von TomTom (falls vorhanden) plus Meldungsalter */}
                    {(incidentStart || incidentEnd || alertReceivedTime) && (
                      <div style={{
                        background: C.creamLight, padding: "6px 8px",
                        borderRadius: 6, marginBottom: 8,
                        fontSize: 11, color: C.textMuted, lineHeight: 1.5,
                      }}>
                        {incidentStart && (
                          <div>📅 <strong>Gültig seit:</strong> {incidentStart}</div>
                        )}
                        {incidentEnd && (
                          <div>📅 <strong>Voraussichtlich bis:</strong> {incidentEnd}</div>
                        )}
                        {alertReceivedTime && (
                          <div title={`Meldung wurde um ${alertReceivedTime} erkannt`}>
                            🕒 <strong>Erkannt:</strong> {alertReceivedTime}
                            {alterMinAgo !== null && alterMinAgo < 1440 && (
                              <span style={{ marginLeft: 4, color: C.text }}>
                                ({alterMinAgo === 0 ? "gerade eben"
                                  : alterMinAgo < 60 ? `vor ${alterMinAgo} min`
                                  : `vor ${Math.round(alterMinAgo / 60)} h`})

                            )}
                          </div>
                        )}
                      </div>
                    )}

                    <div style={{ display: "flex", gap: 8, fontSize: 11, color: C.textMuted, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
                      {delay !== null && <span>⏱ +{delay} min</span>}
                      {length !== null && <span>📏 {length} km</span>}
                      {a.distance !== null && <span>📍 {Math.round(a.distance)} m zur Linie</span>}
                      {(props.from || props.roadNumbers?.[0]) && (
                        <a
                          href={`https://www.google.com/search?q=${encodeURIComponent(`Verkehr ${props.roadNumbers?.[0] || props.from || ""} ${new Date().toLocaleDateString("de-DE")}`)}`}

                          rel="noopener noreferrer"
                          style={{ color: C.navy, fontWeight: 700, textDecoration: "underline" }}
                        >
                          🔍 Mehr Infos
                        </a>
                      )}
                    </div>
                    <div style={{ display: "flex", gap: 8, flexDirection: "column" }}>
                      <button
                        style={{ ...btnPrimary, fontSize: 12, padding: "8px 12px", background: C.warn }}
